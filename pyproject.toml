[project]
name = "sr-dev-tools"
version = "4.0.0"
description = "Sunswift dev tooling (srhigh, srlow, srdbcc)"
requires-python = ">=3.11"
dependencies = [
    "cantools",
]

[project.scripts]
srhigh = "sr_dev_tools.srhigh:main"
srlow = "sr_dev_tools.srlow:main"
srdbcc = "sr_dev_tools.srdbcc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sr_dev_tools"]

[dependency-groups]
dev = ["pytest"]
