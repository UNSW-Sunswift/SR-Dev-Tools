[project]
name = "sr-dev-tools"
version = "3.0.0"
description = "Sunswift high-level DDS package and build tooling (srbuild, srpkg)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
srbuild = "sr_dev_tools.srbuild:main"
srpkg = "sr_dev_tools.srpkg:main"
srlow = "sr_dev_tools.srlow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sr_dev_tools"]

[dependency-groups]
dev = ["pytest"]
